services:
  mongodb:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: alpine/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: alpine/ollama:latest
    container_name: ollama_downloader
    entrypoint: /bin/sh -c "sleep 10 && ollama pull qwen3.5:0.8b"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: on-failure

  api:
    build: .
    container_name: fastapi_rag_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      mongodb:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./lancedb_data:/app/lancedb_data
      - ./seed_data:/app/seed_data

volumes:
  mongo_data:
  ollama_data: